<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TCS Result Card</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --tcs-navy: #28246a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        padding-top: var(--sat);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      body.app-ready {
        background-color: #f8fafc;
      }

      /*
        Smooth reveal container.
        Starts transparent so the native Android windowBackground (splash_window.xml)
        shows through uninterrupted with zero DOM duplicate overlays.
        Fades in smoothly once React mounts and renders the home route.
      */
      #root {
        min-height: 100vh;
        background-color: #f8fafc;
        opacity: 0;
        transition: opacity 220ms ease-out;
        will-change: opacity;
      }
      #root.app-ready {
        opacity: 1;
      }
    </style>
  </head>
  <body class="min-h-screen font-sans antialiased text-foreground">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
